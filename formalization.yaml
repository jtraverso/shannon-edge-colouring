# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Shannon's theorem on edge colourings of multigraphs"
  description: >-
    A Lean 4 / Mathlib formalization of Shannon's theorem (1949): every finite loopless multigraph
    of maximum degree at most Δ has a proper edge colouring with ⌊3Δ/2⌋ colours; and its
    sharpness: for every Δ the Shannon triangle (three vertices with ⌊Δ/2⌋, ⌊Δ/2⌋ and ⌈Δ/2⌉
    parallel edges between the three pairs) has maximum degree at most Δ and no proper edge
    colouring with fewer than ⌊3Δ/2⌋ colours. Multigraphs are edge families ends : ι → V × V
    (parallel edges allowed). Mathlib has no multigraphs and neither result.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C15"]

sources:
  - title: "A theorem on coloring the lines of a network"
    authors:
      - "Claude E. Shannon"
    id: "doi:10.1002/sapm1949281148"
    type: "paper"
    location: "Journal of Mathematics and Physics 28 (1949), 148–152"
    relationship: "formalizes"
    note: >-
      The upper bound ⌊3Δ/2⌋ and the extremal example. The formal proof is the standard Kempe
      chain argument (induction on the coloured edges), not a transcription of Shannon's text.
    license: "all rights reserved"
    author_endorsement: "n/a"

related_formalizations:
  - id: "PALOMAR-2026-10-15-000004 (jtraverso/vizing)"
    relationship: "other"
    note: >-
      Vizing's theorem for simple graphs, with the same Kempe-chain technique; the multigraph
      setting here is independent of that development.

status:
  scope: >-
    Proved for every finite loopless multigraph (finite vertex and edge types) and every Δ; the
    sharpness example exists for every Δ (for Δ = 0 and Δ = 1 it is trivial).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Aristotle (Harmonic)"]
      framework: "Aristotle CLI"
      tool_setup: >-
        Produced the proofs (project dc6e4bbf, Lean 4.28) from the formal statements and a proof
        route supplied under the author's direction.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "API-only"
      prompting_notes: "Formal statements and a natural-language proof route."
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Wrote the statements and sanity checks, audited the return, migrated it to Lean
        v4.35.0-rc3 and the module system, wrote the Challenge/Solution pair and the packaging,
        checked with a local build, a comparison of the elaborated Challenge and Solution
        declarations (pp.all) and #print axioms (Mathlib
        c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "a few hours"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "not tracked"
  notes: >-
    The results were chosen by the human author; the Lean proofs are AI-generated and
    mechanically verified (no sorry, axioms limited to propext, Classical.choice and Quot.sound).

fidelity:
  divergences: >-
    A multigraph is an indexed family of edges ends : ι → V × V on finite types; loops are
    excluded by the hypothesis (ends i).1 ≠ (ends i).2, and parallel edges are distinct indices
    with the same ends. The degree counts incident edge indices. Colours are Fin k.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: the statements
    were compared with Shannon's theorem and checked on small cases (ShannonColouring/Sanity.lean:
    the bound for Δ = 0, 1, 2, 3, a single edge, the triangle). No independent human mathematical
    review has been performed. The result is classical; no mathematical novelty is claimed.

alignment:
  namespace: "ShannonTheorem"
  statements:
    - source: "Shannon (1949): χ′ ≤ ⌊3Δ/2⌋ for loopless multigraphs"
      lean: "ShannonTheorem.shannon"
      module: "Challenge"
      status: "proved"
    - source: "Shannon (1949): the Shannon triangle attains ⌊3Δ/2⌋"
      lean: "ShannonTheorem.shannon_sharp"
      module: "Challenge"
      status: "proved"

acknowledgements: >-
  Mathlib and the Lean community; Harmonic's Aristotle.
